buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

     subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    // Asegura el namespace en el archivo AndroidManifest.xml
                    if (namespace == null) {
                        namespace project.group
                    }

                    compileOptions {
                        sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
                    }

                    java {
                        toolchain {
                            languageVersion = JavaLanguageVersion.of(17) // Especifica la versión de Java 17
                        }
                    }
                }
            }

            // Configuración para asegurarse de que jvmTarget sea 17 en las tareas Kotlin
            if (project.plugins.hasPlugin("kotlin")) {
                project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions {
                        jvmTarget = "17" // Aplica la versión de JVM 17
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

gradle.projectsEvaluated {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17" // Asegura que las tareas Kotlin siempre usen jvmTarget 17
        }
    }
}